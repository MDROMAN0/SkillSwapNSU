{% extends "base.html" %}
{% block title %}{{ code }} &mdash; SkillSwap NSU{% endblock %}

{% block body %}
<main class="container py-5">
  <div class="panel p-5 text-center" style="max-width:520px;margin:3rem auto">
    <div class="stat-num" style="font-size:3rem">{{ code }}</div>
    <p class="text-muted-2">{{ message }}</p>
    <a class="btn btn-brand btn-sm"
       href="{{ url_for('main.dashboard') if me else url_for('main.index') }}">Back to safety</a>
  </div>
</main>
{% endblock %}
