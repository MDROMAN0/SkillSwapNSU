<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>
  (function () {
    try {
      var t = localStorage.getItem('skillswap-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<title>Admin console &mdash; SkillSwap NSU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="static/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
<link href="static/vendor/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="static/css/style.css" rel="stylesheet">
</head>
<body>
<div id="shellNav"></div>

<main class="container py-4">
  <div class="row g-4">
    <div class="col-lg-3"><div class="rail-sticky" id="shellRail"></div></div>

    <div class="col-lg-9">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
          <h1 style="font-size:1.4rem;margin-bottom:2px">
            <i class="bi bi-shield-lock me-2" style="color:var(--brand)"></i>Admin console</h1>
          <p class="text-muted-2 small mb-0">Signed in as <strong>admin</strong>.
            Deleting a student cascades to their skills, requests, sessions and reviews.</p>
        </div>
        <a class="btn btn-sm btn-quiet" href="dashboard.html">
          <i class="bi bi-box-arrow-left me-1"></i>Back to student view</a>
      </div>

      <div class="row g-2 mb-4" id="adminStats"></div>

      <ul class="nav nav-pills mb-3" id="adminTabs">
        <li class="nav-item"><button class="nav-link active btn-sm" data-tab="users">Students</button></li>
        <li class="nav-item"><button class="nav-link btn-sm" data-tab="skills">Skills</button></li>
        <li class="nav-item"><button class="nav-link btn-sm" data-tab="requests">Requests</button></li>
        <li class="nav-item"><button class="nav-link btn-sm" data-tab="reviews">Review moderation</button></li>
      </ul>

      <section class="panel" id="adminPanel"></section>
    </div>
  </div>
</main>

<footer class="site-footer py-3 mt-4">
  <div class="container small d-flex flex-wrap justify-content-between gap-2">
    <span>SkillSwap NSU &middot; CSE311L Database Systems Lab</span>
    <span>&copy; <span data-year></span></span>
  </div>
</footer>

<script src="static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="static/js/data.js"></script>
<script src="static/js/ui.js"></script>
<script>
bootPage('dashboard', 'admin');

let tab = 'users';
let userQ = '', skillQ = '';

/* ---------------- headline numbers ---------------- */
(function () {
  const avg = REVIEWS.length
    ? (REVIEWS.reduce((t, r) => t + r.rating, 0) / REVIEWS.length).toFixed(2) : '—';
  const flagged = REVIEWS.filter(r => r.rating <= 2).length;
  const tiles = [
    [USERS.length, 'Students'],
    [SKILLS.length, 'Skills'],
    [REQUESTS.filter(r => r.status === 'Pending').length, 'Pending requests'],
    [SESSIONS.filter(s => s.status === 'Scheduled').length, 'Upcoming sessions'],
    [avg, 'Average rating'],
    [flagged, 'Low ratings to check']
  ];
  $('#adminStats').innerHTML = tiles.map(([n, l]) => `
    <div class="col-6 col-md-4 col-xl-2"><div class="stat">
      <div class="stat-num" style="font-size:1.25rem">${n}</div>
      <div class="stat-label">${l}</div></div></div>`).join('');
})();

/* ---------------- students ---------------- */
function usersView() {
  const rows = USERS.filter(u =>
    !userQ || u.name.toLowerCase().includes(userQ)
           || u.email.toLowerCase().includes(userQ)
           || u.department.toLowerCase().includes(userQ));

  return `
  <div class="panel-head flex-wrap">
    <h2><i class="bi bi-people me-2"></i>Students (${rows.length})</h2>
    <input class="form-control form-control-sm w-auto" id="userSearch"
           placeholder="Search name, email or department" value="${esc(userQ)}">
  </div>
  <div class="table-responsive"><table class="table table-clean">
    <thead><tr><th>#</th><th>Student</th><th>Department</th><th>Skills</th>
      <th>Exchanges</th><th>Rating</th><th>Joined</th><th class="text-end">Action</th></tr></thead>
    <tbody>${rows.map(u => {
      const r = ratingOf(u.user_id);
      const t = skillsOf(u.user_id, 'Teach').length, l = skillsOf(u.user_id, 'Learn').length;
      const ex = REQUESTS.filter(x => x.sender_id === u.user_id || x.receiver_id === u.user_id).length;
      return `<tr>
        <td class="text-muted-2">${u.user_id}</td>
        <td><div class="d-flex gap-2 align-items-center">
              ${avatar(u, 32)}
              <div class="lh-sm min-w-0">
                <a href="profile.html?id=${u.user_id}" class="fw-semibold text-reset">${esc(u.name)}</a>
                <div class="small text-muted-2 text-truncate" style="max-width:190px">${esc(u.email)}</div>
              </div></div></td>
        <td>${esc(u.department)}</td>
        <td class="small">${t} teach<br><span class="text-muted-2">${l} learn</span></td>
        <td>${ex}</td>
        <td>${r.count ? `<span class="rating-num">${r.avg}</span>
              <span class="small text-muted-2">(${r.count})</span>`
             : '<span class="small text-muted-2">—</span>'}</td>
        <td class="text-muted-2 small">${fmtDate(u.joined)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-quiet text-danger" onclick="delUser(${u.user_id})">
            <i class="bi bi-trash"></i><span class="visually-hidden">Delete</span></button>
        </td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function delUser(id) {
  const u = userById(id);
  const skills = USERSKILLS.filter(x => x.user_id === id).length;
  const reqs = REQUESTS.filter(x => x.sender_id === id || x.receiver_id === id).length;
  demoAction(`DELETE FROM users WHERE user_id = ${id} — removes ${esc(u.name)} plus `
           + `${skills} skill rows and ${reqs} requests through ON DELETE CASCADE.`);
}

/* ---------------- skills ---------------- */
function skillsView() {
  const rows = SKILLS.filter(s =>
    !skillQ || s.skill_name.toLowerCase().includes(skillQ)
            || s.category.toLowerCase().includes(skillQ));

  return `
  <div class="panel-head flex-wrap">
    <h2><i class="bi bi-mortarboard me-2"></i>Skill catalogue (${rows.length})</h2>
    <div class="d-flex gap-2">
      <input class="form-control form-control-sm w-auto" id="skillSearch"
             placeholder="Search skill or category" value="${esc(skillQ)}">
      <button class="btn btn-sm btn-brand" data-bs-toggle="collapse" data-bs-target="#addSkillBox">
        <i class="bi bi-plus-lg me-1"></i>Add skill</button>
    </div>
  </div>

  <div class="collapse" id="addSkillBox">
    <div class="panel-body border-bottom" style="border-color:var(--line)!important">
      <div class="row g-2 align-items-end">
        <div class="col-sm-4">
          <label class="form-label" for="nsName">Skill name</label>
          <input class="form-control form-control-sm" id="nsName" placeholder="e.g. Rust">
        </div>
        <div class="col-sm-3">
          <label class="form-label" for="nsCat">Category</label>
          <select class="form-select form-select-sm" id="nsCat">
            ${CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="col-sm-3">
          <label class="form-label" for="nsDesc">Description</label>
          <input class="form-control form-control-sm" id="nsDesc" placeholder="One line">
        </div>
        <div class="col-sm-2 d-grid">
          <button class="btn btn-sm btn-brand" onclick="addSkill()">Save</button>
        </div>
        <div class="col-12"><div class="small text-danger" id="nsErr"></div></div>
      </div>
    </div>
  </div>

  <div class="table-responsive"><table class="table table-clean">
    <thead><tr><th>#</th><th>Skill</th><th>Category</th><th>Description</th>
      <th>Teachers</th><th>Learners</th><th class="text-end">Action</th></tr></thead>
    <tbody>${rows.map(s => {
      const t = USERSKILLS.filter(x => x.skill_id === s.skill_id && x.skill_type === 'Teach').length;
      const l = USERSKILLS.filter(x => x.skill_id === s.skill_id && x.skill_type === 'Learn').length;
      const used = REQUESTS.some(r => r.teach_skill === s.skill_id || r.learn_skill === s.skill_id);
      return `<tr>
        <td class="text-muted-2">${s.skill_id}</td>
        <td class="fw-semibold">${esc(s.skill_name)}</td>
        <td><span class="pill pill-online">${esc(s.category)}</span></td>
        <td class="small text-muted-2" style="max-width:260px">${esc(s.description)}</td>
        <td>${t}</td><td>${l}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-quiet ${used ? '' : 'text-danger'}"
                  onclick="delSkill(${s.skill_id}, ${used})">
            <i class="bi bi-${used ? 'lock' : 'trash'}"></i>
            <span class="visually-hidden">${used ? 'In use' : 'Delete'}</span></button>
        </td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function addSkill() {
  const name = $('#nsName').value.trim();
  if (name.length < 2) { $('#nsErr').textContent = 'Enter a skill name.'; return; }
  if (SKILLS.some(s => s.skill_name.toLowerCase() === name.toLowerCase())) {
    $('#nsErr').textContent = 'That skill already exists. '
      + 'The UNIQUE constraint on skills.skill_name would reject it.';
    return;
  }
  $('#nsErr').textContent = '';
  demoAction(`INSERT INTO skills (skill_name, category, description) VALUES ('${esc(name)}', `
           + `'${$('#nsCat').value}', ...)`);
}

function delSkill(id, used) {
  if (used) {
    demoAction('This skill is referenced by an exchange request. ON DELETE RESTRICT '
             + 'blocks the DELETE until those requests are removed.');
    return;
  }
  demoAction(`DELETE FROM skills WHERE skill_id = ${id}`);
}

/* ---------------- requests overview ---------------- */
function requestsView() {
  const rows = [...REQUESTS].sort((a, b) => b.created.localeCompare(a.created)).slice(0, 30);
  const counts = {};
  REQUESTS.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);

  return `
  <div class="panel-head flex-wrap">
    <h2><i class="bi bi-arrow-left-right me-2"></i>All exchange requests</h2>
    <div class="d-flex flex-wrap gap-1">
      ${Object.entries(counts).map(([s, n]) => `${pill(s)}<span class="small ms-1 me-2">${n}</span>`).join('')}
    </div>
  </div>
  <div class="table-responsive"><table class="table table-clean">
    <thead><tr><th>#</th><th>Sender</th><th>Receiver</th><th>Offered</th>
      <th>Requested</th><th>Status</th><th>Sessions</th><th>Opened</th></tr></thead>
    <tbody>${rows.map(r => {
      const se = SESSIONS.filter(s => s.request_id === r.request_id).length;
      return `<tr>
        <td class="text-muted-2">${r.request_id}</td>
        <td><a href="profile.html?id=${r.sender_id}" class="text-reset fw-semibold">
              ${esc(userById(r.sender_id).name)}</a></td>
        <td><a href="profile.html?id=${r.receiver_id}" class="text-reset fw-semibold">
              ${esc(userById(r.receiver_id).name)}</a></td>
        <td>${esc(skillById(r.teach_skill).skill_name)}</td>
        <td>${esc(skillById(r.learn_skill).skill_name)}</td>
        <td>${pill(r.status)}</td>
        <td>${se}</td>
        <td class="text-muted-2 small">${fmtDate(r.created)}</td>
      </tr>`;
    }).join('')}</tbody></table></div>
  <div class="panel-body tight py-2 small text-muted-2">
    Showing the 30 most recent of ${REQUESTS.length} requests.</div>`;
}

/* ---------------- review moderation ---------------- */
function reviewsView() {
  const rows = [...REVIEWS].sort((a, b) => a.rating - b.rating);
  return `
  <div class="panel-head flex-wrap">
    <h2><i class="bi bi-flag me-2"></i>Reviews (${REVIEWS.length})</h2>
    <span class="small text-muted-2">Sorted lowest first so problems surface at the top.</span>
  </div>
  <div class="table-responsive"><table class="table table-clean">
    <thead><tr><th>#</th><th>Reviewer</th><th>About</th><th>Rating</th>
      <th>Comment</th><th>Date</th><th class="text-end">Action</th></tr></thead>
    <tbody>${rows.map(r => `
      <tr>
        <td class="text-muted-2">${r.review_id}</td>
        <td><a href="profile.html?id=${r.reviewer_id}" class="text-reset">
              ${esc(userById(r.reviewer_id).name)}</a></td>
        <td><a href="profile.html?id=${r.reviewee_id}" class="text-reset fw-semibold">
              ${esc(userById(r.reviewee_id).name)}</a></td>
        <td>${stars(r.rating)}</td>
        <td class="small" style="max-width:320px">${esc(r.comment)}</td>
        <td class="text-muted-2 small">${fmtDate(r.created)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-quiet text-danger"
                  onclick="demoAction('DELETE FROM reviews WHERE review_id = ${r.review_id}')">
            <i class="bi bi-trash"></i><span class="visually-hidden">Delete</span></button>
        </td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------------- render ---------------- */
function render() {
  $('#adminPanel').innerHTML =
    tab === 'users'    ? usersView()    :
    tab === 'skills'   ? skillsView()   :
    tab === 'requests' ? requestsView() : reviewsView();

  const us = $('#userSearch');
  if (us) us.addEventListener('input', e => {
    userQ = e.target.value.trim().toLowerCase();
    render();
    const box = $('#userSearch');
    box.focus(); box.setSelectionRange(box.value.length, box.value.length);
  });

  const ss = $('#skillSearch');
  if (ss) ss.addEventListener('input', e => {
    skillQ = e.target.value.trim().toLowerCase();
    render();
    const box = $('#skillSearch');
    box.focus(); box.setSelectionRange(box.value.length, box.value.length);
  });
}

$$('#adminTabs .nav-link').forEach(btn => btn.addEventListener('click', () => {
  tab = btn.dataset.tab;
  $$('#adminTabs .nav-link').forEach(b => b.classList.toggle('active', b === btn));
  render();
}));

render();
</script>
</body>
</html>
